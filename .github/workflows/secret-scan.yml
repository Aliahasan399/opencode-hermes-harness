name: Secret scan

# SAFE CHECKS ONLY. An inline, dependency-free regex scan of the files we publish.
# It detects obvious secret shapes and fails on them. Placeholder tokens (YOUR_,
# <...>, {env:...}, example, changeme, not-a-secret, ci-only, test-only) are allowed.
# No real secrets are embedded here. For a stricter scan, run gitleaks locally.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan published docs and config for obvious secrets
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(dir, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p, out);
              else out.push(p);
            }
            return out;
          }

          // Scope: files intended for publication plus optional env template.
          const files = [
            ...walk('integrations'),
            ...walk('.github'),
            ...(fs.existsSync('.env.example') ? ['.env.example'] : []),
          ].filter((f) => /\.(md|json|ya?ml|example)$/.test(f) || f === '.env.example');

          const patterns = [
            ['PEM private key', /-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----/],
            ['AWS access key', /\bAKIA[0-9A-Z]{16}\b/],
            ['GitHub PAT', /\bghp_[A-Za-z0-9]{30,}\b|\bgithub_pat_[A-Za-z0-9_]{30,}\b/],
            ['OpenAI-style key', /\bsk-[A-Za-z0-9]{32,}\b/],
            ['Google API key', /\bAIza[0-9A-Za-z_-]{35}\b/],
            ['Slack token', /\bxox[baprs]-[A-Za-z0-9-]{10,}\b/],
            ['assigned secret value', /(?:password|passwd|secret|api[_-]?key|access[_-]?token)\s*[:=]\s*["']?[A-Za-z0-9/+_\-]{20,}["']?/i],
          ];
          const allow = /YOUR_|<[^>]+>|\{env:|example|changeme|placeholder|not-a-secret|ci-only|test-only/i;

          const findings = [];
          let scanned = 0;
          for (const file of files) {
            scanned++;
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            lines.forEach((line, i) => {
              for (const [name, re] of patterns) {
                if (re.test(line) && !allow.test(line)) {
                  findings.push(`${file}:${i + 1}: ${name}`);
                }
              }
            });
          }

          console.log(`Scanned ${scanned} files for obvious secret shapes.`);
          if (findings.length) {
            for (const f of findings) console.error(f);
            process.exit(1);
          }
          console.log('Secret scan: PASS');
          NODE
