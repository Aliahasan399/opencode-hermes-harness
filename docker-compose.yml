name: opencode-memory

services:
  memory-db:
    image: pgvector/pgvector:pg17
    container_name: opencode-memory-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${MEMORY_DB_USER}
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD}
      POSTGRES_DB: ${MEMORY_DB_NAME}
    ports:
      - "127.0.0.1:${MEMORY_DB_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEMORY_DB_USER} -d ${MEMORY_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - memory-net

  memory-embed:
    image: ollama/ollama:latest
    container_name: opencode-memory-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEMORY_EMBED_PORT}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 12
    networks:
      - memory-net

networks:
  memory-net:
    driver: bridge
